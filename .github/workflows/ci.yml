name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run desktop:check
      - run: npm run desktop:build
      - run: npm test
      - run: npm run evaluate:sources -- ci
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-evaluation-${{ matrix.os }}-node${{ matrix.node }}
          path: .larkanything/evaluation/*/report.json
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run demo
