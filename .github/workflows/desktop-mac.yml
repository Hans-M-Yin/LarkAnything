name: Electron prototype macOS test package
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run desktop:check
      - run: npm test
      - run: npm run desktop:package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: LarkAnything-mac-arm64-unsigned
          path: .larkanything/releases/*.dmg
          include-hidden-files: true
