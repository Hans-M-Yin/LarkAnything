name: Native SwiftUI macOS test package
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: arm64
          cache: npm
      - name: Inspect Apple toolchain
        run: |
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-version
      - run: npm ci --omit=dev --ignore-scripts
      - run: npm test
      - run: npm run native:package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: LarkAnything-native-arm64-test
          path: .larkanything/releases/LarkAnything-Native-*.dmg
          include-hidden-files: true
